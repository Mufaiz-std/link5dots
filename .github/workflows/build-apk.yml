name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROIDAPI: '31'
      ANDROIDMINAPI: '21'
      # Buildozer will download SDK/NDK under $HOME/.buildozer by default.
      # If you want to preinstall/point to a specific NDK, set ANDROIDNDK here.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache buildozer directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ./.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Ensure pip < 24 (fix for pip internals import)
        run: python -m pip install --upgrade "pip<24"

      - name: Install system packages (Java, zip, unzip, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-11-jdk zip unzip libstdc++6 zlib1g-dev

      - name: Setup Java 11 for Actions tools
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Buildozer and build dependencies
        run: |
          python -m pip install --upgrade setuptools wheel
          # pin Cython to a compatible version for many Kivy builds
          python -m pip install --upgrade "Cython>=0.29.21,<0.30"
          # install buildozer (pin if you have a preferred version)
          python -m pip install --upgrade "buildozer==1.4.3"
        env:
          PIP_NO_CACHE_DIR: "false"

      - name: Show python/pip versions and env (debug)
        run: |
          python --version
          pip --version
          java -version
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

      - name: Build APK with Buildozer
        run: |
          # Ensure buildozer.spec exists
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found in repo root."
            exit 1
          fi
          # Run clean/build; 'android debug' command will download SDK/NDK on first run
          buildozer -v android debug
        # keep workspace as working dir (default)
      
      - name: Upload APK artifact(s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            bin/*.apk
            ./.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/**/bin/*.apk
            ./.buildozer/apk/*/*.apk